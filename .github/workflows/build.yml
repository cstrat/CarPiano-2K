name: Build APK

on:
  push:
    branches: [main, english]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --console=plain 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Name the APK
        id: apk
        run: |
          out="CarPiano-2K-build-${{ github.run_number }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/$out"
          echo "path=$RUNNER_TEMP/$out" >> "$GITHUB_OUTPUT"
          ls -la "$RUNNER_TEMP/$out"

      - uses: actions/upload-artifact@v4
        with:
          name: CarPiano-2K-build-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}

      - name: Publish as a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" "${{ steps.apk.outputs.path }}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Build ${{ github.run_number }} (${{ github.ref_name }})" \
            --notes "Automatic build of ${{ github.sha }} from branch ${{ github.ref_name }}. Download the .apk below and install it on the head unit."

      # Build logs are not readable from outside GitHub Actions, so on failure
      # the tail of the log is pushed to a throwaway branch for debugging.
      - name: Save build log on failure
        if: failure()
        run: |
          work="$RUNNER_TEMP/logrepo"
          mkdir -p "$work" && cd "$work"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          { echo "run ${{ github.run_number }} sha ${{ github.sha }} ref ${{ github.ref_name }}"; tail -n 600 "$RUNNER_TEMP/build.log" 2>/dev/null || echo "no build log"; } > build.log
          git add build.log
          git commit -q -m "Build log for run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci-logs
